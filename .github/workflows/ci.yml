name: CI/CD

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  # Общая сборка и тесты
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Tidy
        run: go mod tidy

      - name: Run tests
        run: go test -v -race ./...

      - name: Build static binary (Linux amd64)
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/trip-bot ./cmd/bot
          ls -la dist/   # проверка

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: trip-bot
          path: dist/trip-bot

  # Релиз для разработки (обновляется при каждом push в main)
  release-dev:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: trip-bot
          path: dist/

      - name: Create/Update dev release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/trip-bot
          tag_name: "dev"
          name: "Development Build (latest)"
          prerelease: true
          draft: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Стабильный релиз по тегам (при пуше v*)
  release-stable:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: trip-bot
          path: dist/

      - name: Create stable release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/trip-bot
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}