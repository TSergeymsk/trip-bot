name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Tidy (creates go.sum if missing)
        run: go mod tidy

      - name: Run tests
        run: go test -v -race ./...

      - name: Build
        run: GOOS=linux GOARCH=amd64 go build -o trip-bot ./cmd/bot

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: trip-bot-linux
          path: trip-bot