name: CI/CD

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Tidy
        run: go mod tidy

      - name: Run tests
        run: go test -v -race ./...

      - name: Build static binary (Linux amd64)
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/trip-bot ./cmd/bot
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: trip-bot
          path: dist/trip-bot

  create-release:
    needs: build-and-test
    runs-on: ubuntu-latest
    # Запускаем для push в main ИЛИ для push тега v*
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: trip-bot
          path: dist/

      - name: Determine tag and release name
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Если это тег, используем его
            TAG="${{ github.ref_name }}"
            NAME="Release ${{ github.ref_name }}"
            PRERELEASE="false"
          else
            # Если это push в main, создаём релиз с тегом на основе SHA
            SHORT_SHA="${GITHUB_SHA::8}"
            TAG="build-$SHORT_SHA"
            NAME="Build from commit $SHORT_SHA"
            PRERELEASE="false"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/trip-bot
          generate_release_notes: true
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.name }}
          prerelease: ${{ steps.vars.outputs.prerelease }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}